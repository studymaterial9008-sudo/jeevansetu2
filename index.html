<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#c62828">
  <meta name="description" content="JeevanSetu - Emergency Blood Donor Matching System">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.svg" type="image/svg+xml">
  <title>JeevanSetu — Emergency Blood Donor Finder</title>
  <style>
    :root{--red:#c62828;--red2:#e53935;--green:#1b8a4b;--ink:#18212b;--muted:#667085;--bg:#f6f8fb;--card:#fff;--line:#e5e7eb;--soft:#fff4f4}
    *{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}
    button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.appbar{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;justify-content:space-between}
    .brand{display:flex;gap:10px;align-items:center;font-weight:800}.drop{width:36px;height:36px;border-radius:12px;background:var(--soft);display:grid;place-items:center;font-size:21px}
    .wrap{max-width:980px;margin:auto;padding:18px 16px 100px}.hero{background:linear-gradient(135deg,#fff,#fff5f5);border:1px solid #ffd6d6;border-radius:24px;padding:28px;margin:10px 0 18px}
    h1{font-size:clamp(30px,7vw,50px);line-height:1.05;margin:8px 0 12px}.hero p{color:var(--muted);font-size:17px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 5px 18px #11111108}.btn{padding:13px 16px;border-radius:12px;font-weight:800}.primary{background:var(--red);color:#fff}.success{background:var(--green);color:#fff}.outline{background:#fff;border:1px solid var(--line);color:var(--ink)}.danger{background:#fff0f0;color:#b42318}
    .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.small{font-size:13px;color:var(--muted)}.title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:22px 0 12px}.title h2{margin:0}
    label{display:block;font-size:13px;font-weight:800;margin:12px 0 6px}input,select,textarea{width:100%;padding:12px;border:1px solid #d7dce3;border-radius:11px;background:#fff;outline:none}input:focus,select:focus,textarea:focus{border-color:#e57373;box-shadow:0 0 0 3px #c6282814}
    .formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 14px}.full{grid-column:1/-1}.badge{display:inline-flex;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:800;background:#edf7f0;color:var(--green)}.badge.red{background:#fff0f0;color:var(--red)}
    .donor{display:flex;gap:14px;align-items:center}.avatar{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:#fff0f0;font-weight:900;color:var(--red);flex:none}.grow{flex:1}.distance{font-weight:900}.list{display:grid;gap:12px}
    .nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;gap:4px;padding:8px;z-index:30}.nav button{background:transparent;padding:8px 10px;border-radius:10px;color:var(--muted);font-size:12px}.nav button.active{background:#fff0f0;color:var(--red);font-weight:800}
    .toast{position:fixed;right:16px;bottom:76px;background:#18212b;color:#fff;padding:12px 15px;border-radius:12px;display:none;z-index:50}.toast.show{display:block}.hidden{display:none!important}
    .steps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.step{padding:10px;border-radius:12px;background:#f4f5f7;text-align:center;font-size:12px}.step.on{background:#fff0f0;color:var(--red);font-weight:800}
    .stat{font-size:28px;font-weight:900}.request{border-left:4px solid var(--red)}.qrbox{display:grid;place-items:center;min-height:230px;border:1px dashed #cfd5dd;border-radius:16px;padding:18px}
    @media(max-width:650px){.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.hero{padding:22px}.nav{justify-content:space-around}.nav button{padding:8px 5px}}
  
    .view-enter{animation:viewEnter .42s cubic-bezier(.2,.8,.2,1) both}.view-exit{animation:viewExit .12s ease both}
    @keyframes viewEnter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
    @keyframes viewExit{to{opacity:0;transform:translateY(-5px)}}
    /* JeevanSetu Premium UI — concept unchanged */
    html{scroll-behavior:smooth}
    body{overflow-x:hidden}
    .appbar{backdrop-filter:blur(14px);background:rgba(255,255,255,.92);box-shadow:0 2px 18px #1111110a;animation:dropIn .55s ease both}
    .brand{letter-spacing:-.2px}.drop{box-shadow:0 8px 24px #c6282820;animation:heartbeat 2.2s ease-in-out infinite}
    .wrap{animation:pageIn .45s ease both}
    .hero{position:relative;overflow:hidden;box-shadow:0 14px 40px #c6282810;animation:heroIn .65s cubic-bezier(.2,.8,.2,1) both}
    .hero:before{content:"";position:absolute;width:180px;height:180px;border-radius:50%;background:#c6282810;right:-70px;top:-70px;animation:float 5s ease-in-out infinite}
    .hero>*{position:relative;z-index:1}
    h1{letter-spacing:-1.8px}
    .card{transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease;animation:rise .55s cubic-bezier(.2,.8,.2,1) both}
    .card:hover{transform:translateY(-3px);box-shadow:0 12px 30px #11111112;border-color:#f0caca}
    .grid>.card:nth-child(2){animation-delay:.08s}.grid>.card:nth-child(3){animation-delay:.16s}
    .btn{position:relative;overflow:hidden;transition:transform .18s ease,box-shadow .18s ease,filter .18s ease}
    .btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px #11111114;filter:saturate(1.05)}
    .btn:active{transform:scale(.97)}
    .primary:hover{box-shadow:0 9px 24px #c6282838}.success:hover{box-shadow:0 9px 24px #1b8a4b32}
    .btn:after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,#ffffff35 50%,transparent 65%);transform:translateX(-120%);transition:transform .5s ease}
    .btn:hover:after{transform:translateX(120%)}
    input,select,textarea{transition:border-color .2s ease,box-shadow .2s ease,transform .2s ease}
    input:focus,select:focus,textarea:focus{transform:translateY(-1px)}
    .formgrid>div{animation:fieldIn .42s ease both}
    .formgrid>div:nth-child(2){animation-delay:.03s}.formgrid>div:nth-child(3){animation-delay:.06s}.formgrid>div:nth-child(4){animation-delay:.09s}
    .formgrid>div:nth-child(5){animation-delay:.12s}.formgrid>div:nth-child(6){animation-delay:.15s}.formgrid>div:nth-child(7){animation-delay:.18s}.formgrid>div:nth-child(8){animation-delay:.21s}
    .formgrid>div:nth-child(9){animation-delay:.24s}.formgrid>div:nth-child(10){animation-delay:.27s}
    .actions{animation:rise .45s .1s ease both}
    .title{animation:slideRight .48s ease both}
    .title h2{letter-spacing:-.5px}
    .steps .step{transition:transform .2s ease,background .2s ease;animation:rise .45s ease both}
    .steps .step:nth-child(2){animation-delay:.08s}.steps .step:nth-child(3){animation-delay:.16s}.steps .step:nth-child(4){animation-delay:.24s}
    .steps .step:hover{transform:translateY(-2px)}
    .list .card{animation:resultIn .5s cubic-bezier(.2,.8,.2,1) both}
    .list .card:nth-child(2){animation-delay:.06s}.list .card:nth-child(3){animation-delay:.12s}.list .card:nth-child(4){animation-delay:.18s}.list .card:nth-child(5){animation-delay:.24s}.list .card:nth-child(6){animation-delay:.30s}
    .donor .avatar{transition:transform .25s ease}.donor:hover .avatar{transform:scale(1.08) rotate(-3deg)}
    .badge{box-shadow:0 3px 10px #1b8a4b12}
    .nav{backdrop-filter:blur(14px);background:rgba(255,255,255,.94);box-shadow:0 -4px 20px #1111110a}
    .nav button{transition:transform .18s ease,color .18s ease,background .18s ease}.nav button:hover{transform:translateY(-2px)}
    .toast{animation:toastIn .3s ease both}
    .request{animation:pulseBorder 2.8s ease-in-out infinite}
    .qrbox{background:linear-gradient(135deg,#fff,#fafafa)}
    @keyframes pageIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
    @keyframes heroIn{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:none}}
    @keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
    @keyframes resultIn{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
    @keyframes fieldIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
    @keyframes slideRight{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:none}}
    @keyframes dropIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
    @keyframes toastIn{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(12px)}}
    @keyframes heartbeat{0%,40%,100%{transform:scale(1)}20%{transform:scale(1.08)}28%{transform:scale(1)}}
    @keyframes pulseBorder{0%,100%{box-shadow:inset 0 0 0 0 #c6282800}50%{box-shadow:inset 0 0 0 3px #c6282810}}
    @media(max-width:650px){
      .hero{border-radius:22px}.hero .actions .btn{flex:1;min-width:145px}
      .card{border-radius:16px}.nav button{min-width:56px}
      h1{letter-spacing:-1px}
    }
    @media(prefers-reduced-motion:reduce){
      *,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}
    }
</style>
</head>
<body>
<div id="app" class="app-shell"></div><div id="toast" class="toast"></div>
<script>
const DEMO_DONORS=[
 {id:"d1",name:"Rahul Kumar",blood:"B+",state:"Bihar",district:"Nalanda",city:"Bihar Sharif",hospital:"City Hospital, Bihar Sharif",distance:1.2,available:true},
 {id:"d2",name:"Aman Kumar",blood:"B+",state:"Bihar",district:"Nalanda",city:"Bihar Sharif",hospital:"Sadar Hospital, Bihar Sharif",distance:2.8,available:true},
 {id:"d3",name:"Pooja Singh",blood:"B+",state:"Bihar",district:"Nalanda",city:"Bihar Sharif",hospital:"City Hospital, Bihar Sharif",distance:3.6,available:true},
 {id:"d4",name:"Suresh Kumar",blood:"B+",state:"Bihar",district:"Nalanda",city:"Rajgir",hospital:"Sub-Divisional Hospital, Rajgir",distance:14.4,available:true},
 {id:"d5",name:"Neha Devi",blood:"O+",state:"Bihar",district:"Patna",city:"Patna",hospital:"PMCH, Patna",distance:55.2,available:true}
];
const HOSPITALS=["City Hospital, Bihar Sharif","Sadar Hospital, Bihar Sharif","Sub-Divisional Hospital, Rajgir","PMCH, Patna","AIIMS Patna"];
const states=["Bihar","Jharkhand","West Bengal","Delhi","Uttar Pradesh"];
const districts={Bihar:["Nalanda","Patna","Gaya"],Jharkhand:["Ranchi","Ramgarh","Hazaribagh"],"West Bengal":["Purba Medinipur","Kolkata"],Delhi:["New Delhi"],"Uttar Pradesh":["Agra","Mathura"]};
let state={page:"home",user:JSON.parse(localStorage.getItem("js_user")||"null"),request:JSON.parse(localStorage.getItem("js_request")||"null"),installEvent:null};

function save(){localStorage.setItem("js_user",JSON.stringify(state.user));localStorage.setItem("js_request",JSON.stringify(state.request))}
function toast(x){const t=document.getElementById("toast");t.textContent=x;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2400)}
function app(){document.getElementById("app").innerHTML=`<header class="appbar"><div class="brand"><span class="drop">🩸</span> JeevanSetu</div><button class="btn outline" onclick="go('profile')">☰</button></header><main class="wrap"><div id="view"></div></main>${nav()}`;render()}
function nav(){return `<nav class="nav"><button onclick="go('home')">🏠<br>Home</button><button onclick="go('find')">🩸<br>Find Blood</button><button onclick="go('donor')">❤️<br>Donor</button><button onclick="go('requests')">📋<br>Requests</button><button onclick="go('profile')">👤<br>Profile</button></nav>`}
function go(p){
  state.page=p;
  const v=document.getElementById("view");
  if(v){v.classList.remove("view-enter");v.classList.add("view-exit");setTimeout(()=>{render();scrollTo({top:0,behavior:"smooth"})},120)}
  else render();
}
function render(){let v=document.getElementById("view");if(!v)return;const p=state.page;v.innerHTML=
 p==="home"?home():p==="register"?register():p==="login"?login():p==="find"?find():p==="results"?results():p==="emergency"?emergency():p==="donor"?donor():p==="requestdetail"?requestdetail():p==="requests"?requests():p==="profile"?profile():p==="install"?install():p==="admin"?admin():about();v.classList.remove("view-exit");v.classList.add("view-enter");}

function home(){return `<section class="hero"><div class="badge">Emergency Blood Donor Matching</div><h1>Find blood.<br>Connect fast.<br>Help save lives.</h1><p>JeevanSetu helps a requester discover potentially available, nearby donors using blood group and location-based matching.</p><div class="actions"><button class="btn primary" onclick="go('find')">🔎 FIND BLOOD</button><button class="btn success" onclick="go('register')">🩸 BECOME A DONOR</button></div></section>
<div class="grid"><div class="card"><div class="stat">⚡ Fast</div><p class="small">Search by blood group, district, city and hospital.</p></div><div class="card"><div class="stat">📍 Nearby</div><p class="small">Nearest available demo donors are ranked first.</p></div><div class="card"><div class="stat">🔐 Private</div><p class="small">Sensitive profile details stay hidden until a request is accepted.</p></div></div>
<div class="title"><h2>How it works</h2></div><div class="steps"><div class="step on">1<br>Request</div><div class="step">2<br>Match</div><div class="step">3<br>Notify</div><div class="step">4<br>Connect</div></div>
<div class="title"><h2>Try the demo</h2></div><div class="card"><p><b>Demo scenario:</b> B+ blood needed at City Hospital, Bihar Sharif.</p><button class="btn primary" onclick="demoRequest()">Run demo request</button></div>`}

function register(){return `<div class="title"><h2>Create donor account</h2></div><div class="card"><div class="formgrid">
<div><label>Full name</label><input id="rname" placeholder="Rahul Kumar"></div><div><label>Date of birth</label><input id="rdob" type="date"></div>
<div><label>Mobile number</label><input id="rmobile" inputmode="numeric" maxlength="10" placeholder="10-digit mobile"></div><div><label>Email (optional)</label><input id="remail" type="email" placeholder="you@example.com"></div>
<div><label>Blood group</label><select id="rblood">${bloodOptions()}</select></div><div><label>State</label><select id="rstate" onchange="loadDistrict('rstate','rdistrict')">${states.map(x=>`<option>${x}</option>`).join("")}</select></div>
<div><label>District</label><select id="rdistrict">${districts.Bihar.map(x=>`<option>${x}</option>`).join("")}</select></div><div><label>City / Area</label><input id="rcity" placeholder="Bihar Sharif"></div>
<div class="full"><label>Address</label><textarea id="raddress" rows="2" placeholder="Full address (kept private)"></textarea></div>
<div><label>Password</label><input id="rpass" type="password" placeholder="Create password"></div><div><label>Confirm password</label><input id="rpass2" type="password"></div>
<div class="full"><label><input id="ravail" type="checkbox" checked style="width:auto"> I am currently available as a donor</label><p class="small">This college prototype uses demo data. Do not enter real medical or sensitive information.</p></div>
</div><button class="btn success" onclick="registerUser()">REGISTER</button></div><p class="small">Already registered? <button class="btn outline" onclick="go('login')">Login</button></p>`}
function bloodOptions(){return ["A+","A-","B+","B-","AB+","AB-","O+","O-"].map(x=>`<option>${x}</option>`).join("")}
function loadDistrict(s,d){const val=document.getElementById(s).value;document.getElementById(d).innerHTML=(districts[val]||["Select district"]).map(x=>`<option>${x}</option>`).join("")}
function registerUser(){const g=id=>document.getElementById(id).value.trim();if(!g("rname")||!g("rdob")||g("rmobile").length<10||!g("rpass"))return toast("Please complete the required fields.");if(g("rpass")!==g("rpass2"))return toast("Passwords do not match.");state.user={id:"u"+Date.now(),name:g("rname"),dob:g("rdob"),mobile:g("rmobile"),email:g("remail"),blood:g("rblood"),state:g("rstate"),district:g("rdistrict"),city:g("rcity"),address:g("raddress"),available:document.getElementById("ravail").checked,password:g("rpass")};save();toast("Registration successful");go("profile")}
function login(){return `<div class="title"><h2>Welcome back</h2></div><div class="card"><label>Mobile number or email</label><input id="luser" placeholder="Enter mobile/email"><label>Password</label><input id="lpass" type="password" placeholder="Password"><div class="actions"><button class="btn primary" onclick="loginUser()">LOGIN</button><button class="btn outline" onclick="toast('Demo: use the account you registered on this device.')">Forgot Password?</button></div></div><p class="small">Don't have an account? <button class="btn outline" onclick="go('register')">Register now</button></p>`}
function loginUser(){const u=state.user;if(!u)return toast("No local account found. Register first.");const a=document.getElementById("luser").value.trim(),p=document.getElementById("lpass").value;if((a===u.mobile||a.toLowerCase()===u.email.toLowerCase())&&p===u.password){toast("Login successful");go("profile")}else toast("Login details are incorrect.")}
function find(){return `<div class="title"><h2>Find Blood</h2><span class="badge red">Emergency ready</span></div><div class="card"><p class="small">Enter the request location. The prototype ranks exact blood-group matches by availability and distance.</p><div class="formgrid">
<div><label>Blood group</label><select id="fblood">${bloodOptions()}</select></div><div><label>Units required</label><input id="funits" type="number" min="1" value="1"></div>
<div><label>State</label><select id="fstate" onchange="loadDistrict('fstate','fdistrict')">${states.map(x=>`<option>${x}</option>`).join("")}</select></div>
<div><label>District</label><select id="fdistrict">${districts.Bihar.map(x=>`<option>${x}</option>`).join("")}</select></div>
<div><label>City / Area</label><input id="fcity" value="Bihar Sharif"></div><div><label>Hospital</label><select id="fhospital">${HOSPITALS.map(x=>`<option>${x}</option>`).join("")}</select></div>
<div><label>Required by</label><input id="fwhen" type="datetime-local"></div><div><label>Emergency level</label><select id="flevel"><option>Critical</option><option>Urgent</option><option>Normal</option></select></div>
</div><div class="actions"><button class="btn primary" onclick="searchDonors()">SEARCH DONORS</button><button class="btn danger" onclick="go('emergency')">🚨 CREATE EMERGENCY REQUEST</button></div></div>`}
function searchDonors(){const req={blood:document.getElementById("fblood").value,units:+document.getElementById("funits").value,state:document.getElementById("fstate").value,district:document.getElementById("fdistrict").value,city:document.getElementById("fcity").value,hospital:document.getElementById("fhospital").value,level:document.getElementById("flevel").value};state.request=req;save();go("results")}
function results(){const r=state.request||{};let ds=DEMO_DONORS.filter(d=>d.blood===r.blood&&d.available);ds=ds.sort((a,b)=>score(b,r)-score(a,r));return `<div class="title"><h2>Matching Donors</h2><span class="badge">${ds.length} found</span></div><div class="card"><p><b>${r.blood}</b> • ${r.hospital} • ${r.city||"Location"}</p><p class="small">Ranking: exact blood group → availability → same city/district → nearest distance.</p></div><div class="list">${ds.length?ds.map(d=>donorCard(d,r)).join(""):`<div class="card"><h3>No demo match found</h3><p class="small">Try another blood group or demo location.</p></div>`}</div><div class="actions"><button class="btn danger" onclick="go('emergency')">🚨 Create Emergency Request</button><button class="btn outline" onclick="go('find')">Change search</button></div>`}
function score(d,r){return (d.city===r.city?50:0)+(d.district===r.district?30:0)+(d.state===r.state?15:0)-d.distance}
function donorCard(d,r){return `<div class="card donor"><div class="avatar">${d.name[0]}</div><div class="grow"><b>${d.name}</b><div><span class="badge">${d.blood}</span> <span class="small">${d.distance} km away</span></div><div class="small">Available • ${d.hospital}</div></div><button class="btn success" onclick="sendRequest('${d.id}')">SEND REQUEST</button></div>`}
function emergency(){return `<div class="title"><h2>Emergency Blood Request</h2><span class="badge red">Priority: emergency</span></div><div class="card"><div class="formgrid"><div><label>Requester name</label><input id="ename" value="${state.user?.name||""}" placeholder="Your name"></div><div><label>Patient reference</label><input id="epatient" placeholder="Patient / case name"></div><div><label>Blood group</label><select id="eblood">${bloodOptions()}</select></div><div><label>Units required</label><input id="eunits" type="number" value="1" min="1"></div><div><label>State</label><select id="estate" onchange="loadDistrict('estate','edistrict')">${states.map(x=>`<option>${x}</option>`).join("")}</select></div><div><label>District</label><select id="edistrict">${districts.Bihar.map(x=>`<option>${x}</option>`).join("")}</select></div><div><label>City / Area</label><input id="ecity" value="Bihar Sharif"></div><div><label>Hospital</label><select id="ehospital">${HOSPITALS.map(x=>`<option>${x}</option>`).join("")}</select></div><div class="full"><label>Message (optional)</label><textarea id="emsg" rows="3" placeholder="Any useful non-sensitive information"></textarea></div></div><div class="actions"><button class="btn primary" onclick="createEmergency()">SUBMIT EMERGENCY REQUEST</button></div><p class="small">For the college prototype, this only creates a demo request. Real emergencies should always be coordinated with a hospital/blood bank.</p></div>`}
function createEmergency(){const g=id=>document.getElementById(id).value;state.request={blood:g("eblood"),units:+g("eunits"),state:g("estate"),district:g("edistrict"),city:g("ecity"),hospital:g("ehospital"),level:"Critical",requester:g("ename"),patient:g("epatient"),message:g("emsg"),status:"Open",created:new Date().toISOString()};save();toast("Emergency request created");go("results")}
function sendRequest(id){if(!state.request)return toast("Create a blood request first.");state.request.status="Sent";state.request.donorId=id;state.request.donorName=DEMO_DONORS.find(d=>d.id===id)?.name;save();toast("Request sent to donor");go("requests")}
function donor(){return `<div class="title"><h2>Donor Dashboard</h2>${state.user?`<span class="badge">${state.user.blood}</span>`:""}</div>${state.user?`<div class="card"><h3>Hello, ${state.user.name}</h3><p><span class="badge">${state.user.blood}</span> <span class="badge">${state.user.available?"Available":"Unavailable"}</span></p><div class="grid"><button class="btn outline" onclick="go('profile')">👤 My Profile</button><button class="btn outline" onclick="toggleAvailability()">🟢 Availability</button><button class="btn outline" onclick="go('requests')">📋 My Requests</button></div></div><div class="title"><h2>Incoming demo request</h2></div>${state.request?.status==="Sent"?`<div class="card request"><b>🚨 ${state.request.blood} blood required</b><p>${state.request.hospital}<br>${state.request.city}, ${state.request.district}</p><div class="actions"><button class="btn success" onclick="acceptRequest()">ACCEPT</button><button class="btn danger" onclick="declineRequest()">DECLINE</button></div></div>`:`<div class="card"><p class="small">No incoming demo request.</p></div>`}`:`<div class="card"><h3>Donor account needed</h3><p>Register to use the donor dashboard.</p><button class="btn success" onclick="go('register')">REGISTER AS DONOR</button></div>`}`}
function acceptRequest(){state.request.status="Accepted";save();toast("Request accepted");go("requestdetail")}
function declineRequest(){state.request.status="Declined";save();toast("Request declined");go("requests")}
function requestdetail(){const r=state.request;if(!r)return `<div class="card">No request.</div>`;return `<div class="title"><h2>Request Details</h2></div><div class="card"><p><b>Blood:</b> ${r.blood}</p><p><b>Hospital:</b> ${r.hospital}</p><p><b>Location:</b> ${r.city}, ${r.district}, ${r.state}</p><p><b>Units:</b> ${r.units}</p><p><b>Status:</b> <span class="badge">${r.status}</span></p>${r.status==="Accepted"?`<div class="card" style="background:#f0faf3"><h3>✅ Request accepted</h3><p class="small">For a real deployment, contact details would be shared only after appropriate consent and verification.</p></div>`:""}</div><button class="btn outline" onclick="go('requests')">BACK TO REQUESTS</button>`}
function requests(){const r=state.request;return `<div class="title"><h2>Requests</h2></div>${r?`<div class="card request"><b>${r.blood} • ${r.units} unit(s)</b><p>${r.hospital}<br>${r.city}, ${r.district}, ${r.state}</p><p>Status: <span class="badge">${r.status||"Open"}</span></p><button class="btn outline" onclick="go('requestdetail')">VIEW DETAILS</button></div>`:`<div class="card"><p class="small">No requests yet.</p></div>`}`}
function profile(){return state.user?`<div class="title"><h2>My Profile</h2></div><div class="card"><div class="grid"><div><p class="small">Name</p><b>${state.user.name}</b></div><div><p class="small">Blood group</p><b>${state.user.blood}</b></div><div><p class="small">Mobile</p><b>${state.user.mobile}</b></div><div><p class="small">Location</p><b>${state.user.city}, ${state.user.district}</b></div></div><hr style="border:0;border-top:1px solid var(--line);margin:18px 0"><p class="small">Full address and DOB are private in this prototype.</p><div class="actions"><button class="btn outline" onclick="go('donor')">DONOR DASHBOARD</button><button class="btn danger" onclick="logout()">LOG OUT</button></div></div><div class="card"><h3>📲 Install JeevanSetu</h3><p class="small">Open the live site on your phone and use the install button or browser's “Add to Home Screen”.</p><button class="btn primary" onclick="go('install')">INSTALL GUIDE</button></div>`:`<div class="title"><h2>Account</h2></div><div class="card"><p>Register once, then login later with your mobile/email and password.</p><div class="actions"><button class="btn success" onclick="go('register')">REGISTER</button><button class="btn primary" onclick="go('login')">LOGIN</button></div></div>`}
function toggleAvailability(){state.user.available=!state.user.available;save();toast("Availability updated");render()}
function logout(){state.user=null;localStorage.removeItem("js_user");toast("Logged out");go("home")}
function install(){return `<div class="title"><h2>Install JeevanSetu</h2></div><div class="card"><h3>📱 Android / Chrome</h3><p>1. Open the live JeevanSetu URL.<br>2. Tap <b>Install App</b> if the browser shows it.<br>3. If not, use browser menu → <b>Add to Home screen</b>.</p><button class="btn primary" onclick="installPWA()">INSTALL APP</button></div><div class="card"><h3>🍎 iPhone / Safari</h3><p>Use Share → <b>Add to Home Screen</b>. PWA installation UI differs by browser.</p></div><div class="card"><h3>🔳 College QR</h3><p class="small">After deployment, use the live URL below to create a QR code. Anyone scanning it can open the installation page.</p><div class="qrbox"><div id="qrcode"></div></div><p id="liveurl" class="small" style="word-break:break-all;text-align:center"></p></div>`}
function admin(){return `<div class="title"><h2>Admin Dashboard</h2><span class="badge">Demo</span></div><div class="grid"><div class="card"><div class="stat">${DEMO_DONORS.length}</div><div class="small">Demo donors</div></div><div class="card"><div class="stat">${DEMO_DONORS.filter(x=>x.available).length}</div><div class="small">Available</div></div><div class="card"><div class="stat">${state.request?1:0}</div><div class="small">Open demo request</div></div></div><div class="card"><h3>Privacy-first design</h3><p class="small">Admin controls for a real version should include verification, audit logs, consent, abuse prevention and role-based access.</p></div>`}
function about(){return `<div class="title"><h2>About JeevanSetu</h2></div><div class="card"><h3>Purpose</h3><p>JeevanSetu is a college prototype for reducing the time needed to discover potentially available blood donors nearby.</p><p class="small">It is not a blood bank and does not replace hospital/blood-bank verification or medical advice.</p></div>`}
function demoRequest(){state.request={blood:"B+",units:2,state:"Bihar",district:"Nalanda",city:"Bihar Sharif",hospital:"City Hospital, Bihar Sharif",level:"Critical",status:"Open"};save();go("results")}
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();state.installEvent=e})
async function installPWA(){if(state.installEvent){state.installEvent.prompt();await state.installEvent.userChoice;state.installEvent=null}else toast("Use browser menu → Add to Home screen if no install prompt appears.")}
function id(x){return document.getElementById(x)}
app();
if(location.hash==="#admin")go("admin");
if(location.hash==="#about")go("about");
if(location.hash==="#install")go("install");
</script>
</body>
</html>
